<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ATU Study Planner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,sans-serif}
body{background:#f8f8f8;padding:20px}
.box{max-width:800px;margin:0 auto;background:#fff;border-radius:18px;border:4px solid #FFD600;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.2)}
header{background:#000;color:#FFD600;padding:26px;text-align:center}
.add{margin:16px;border:2.5px solid #000;border-radius:14px;padding:16px;background:#fff}
.row{display:flex;gap:10px;margin-bottom:10px}
input,select{flex:1;padding:11px;border:2px solid #000;border-radius:10px}
.btn{padding:11px 18px;background:#FFD600;color:#000;border:2.5px solid #000;border-radius:10px;font-weight:800;cursor:pointer}
.search{background:#FFD600;border:2.5px solid #000;margin:0 16px 16px 16px;border-radius:12px;padding:12px;display:flex;gap:10px}
.filter{margin:0 16px 16px 16px;border:2.5px solid #000;border-radius:12px;padding:12px;display:flex;gap:8px;align-items:center}
.fbtn{padding:6px 14px;border:2px solid #000;background:#fff;border-radius:20px;font-weight:700;cursor:pointer}
.fbtn.active{background:#000;color:#FFD600}
.item{display:flex;justify-content:space-between;padding:12px 16px;border:2px solid #000;border-radius:12px;margin:0 16px 10px 16px;background:#fff}
.item.done{opacity:.5}
.empty{text-align:center;padding:30px;color:#888;border:2px dashed #000;border-radius:12px;margin:16px}
</style>
</head>
<body>
<div class="box">
<header><h1>ATU STUDY PLANNER</h1><p>Organise Your Task <br> 2026</p></header>

<div class="add">
<h3>Add New Study Task</h3>
<div class="row">
<input id="t1" placeholder="Task title * e.g. Information Tech">
<input id="t2" placeholder="Subject e.g. IT 101">
</div>
<div class="row">
<select id="t3"><option>Normal Priority</option><option>High Priority</option><option>Low Priority</option></select>
<input type="date" id="t4">
<button class="btn" onclick="addTask()">Add Task +</button>
</div>
<p id="err" style="color:red;font-weight:700"></p>
</div>

<div class="search">
<input id="search" placeholder="Search by title, subject, High / Low / Normal..." oninput="render()">
<button class="btn" onclick="clearSearch()">Clear</button>
</div>

<div class="filter">
<button class="fbtn active" onclick="setFilter('all',this)">All</button>
<button class="fbtn" onclick="setFilter('active',this)">Active</button>
<button class="fbtn" onclick="setFilter('completed',this)">Completed</button>
<span id="count" style="margin-left:auto;font-weight:700"></span>
<button class="btn" style="padding:6px 12px" onclick="clearCompleted()">Clear Completed</button>
</div>

<ul id="list" style="list-style:none"></ul>
<div id="empty" class="empty">No tasks yet. Add your first task above! Tasks stay even after refresh</div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem('atu_final_fixed')||'[]');
let filter='all';
function save(){localStorage.setItem('atu_final_fixed',JSON.stringify(tasks));}
function addTask(){
var title=document.getElementById('t1').value.trim();
var subj=document.getElementById('t2').value.trim();
var pri=document.getElementById('t3').value;
var date=document.getElementById('t4').value;
var err=document.getElementById('err');
if(!title){err.textContent='Please enter title';return;}
err.textContent='';
tasks.unshift({id:Date.now(),title:title,subject:subj||'General',priority:pri,date:date,done:false});
save();
document.getElementById('t1').value='';
document.getElementById('t2').value='';
render();
}
function render(){
var list=document.getElementById('list');
var empty=document.getElementById('empty');
var q=document.getElementById('search').value.toLowerCase();
list.innerHTML='';
var filtered=tasks.filter(function(x){
if(filter==='active'&&x.done) return false;
if(filter==='completed'&&!x.done) return false;
if(q){
return x.title.toLowerCase().indexOf(q)>-1 || x.subject.toLowerCase().indexOf(q)>-1 || x.priority.toLowerCase().indexOf(q)>-1;
}
return true;
});
empty.style.display=filtered.length?'none':'block';
document.getElementById('count').textContent=filtered.length+' shown';
filtered.forEach(function(task){
var idx=tasks.findIndex(function(t){return t.id===task.id});
var li=document.createElement('li');
li.className='item'+(task.done?' done':'');
li.innerHTML='<div><span style="border:2px solid #000;border-radius:50%;width:24px;height:24px;display:inline-grid;place-items:center;cursor:pointer;background:'+(task.done?'#FFD600':'#fff')+'" onclick="toggleTask('+idx+')">'+(task.done?'✓':'')+'</span> <b>'+task.title+'</b> <small style="background:#000;color:#FFD600;padding:2px 6px;border-radius:10px">'+task.priority+'</small><br><small style="margin-left:32px;color:#555">'+task.subject+' • '+(task.date||'No date')+'</small></div><div><span style="cursor:pointer" onclick="delTask('+idx+')">🗑️</span></div>';
list.appendChild(li);
});
}
function toggleTask(i){tasks[i].done=!tasks[i].done;save();render();}
function delTask(i){if(confirm('Delete?')){tasks.splice(i,1);save();render();}}
function setFilter(f,btn){filter=f;var btns=document.querySelectorAll('.fbtn');for(var j=0;j<btns.length;j++)btns[j].classList.remove('active');btn.classList.add('active');render();}
function clearSearch(){document.getElementById('search').value='';render();}
function clearCompleted(){if(confirm('Clear completed?')){tasks=tasks.filter(function(x){return !x.done});save();render();}}
render();
</script>
</body>
</html>
